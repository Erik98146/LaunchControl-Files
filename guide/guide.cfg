; LaunchControl User Guide — page settings.
; Edit the values, then run:  python guide/build_guide.py
; Everything else (chapters, pictures) lives in guide/chapters/ and guide/images/.

[guide]
title = LaunchControl User Guide
eyebrow = Product user guide
lead = Installation, setup, configuration, and everyday operation for the LaunchControl Hub, web dashboard, Touch 8, and Mini.
description = Complete LaunchControl product user guide: installation, setup, configuration, operation, troubleshooting, and technical reference.
version = 0.8
; date = auto   stamps today's date at build time; or write one out, e.g.  date = August 30, 2026
date = auto
hero_image = images/hero-devices.png
hero_alt = LaunchControl dashboard shown on multiple devices
footer = Intelligent RV control platform · launchcontrol.tech

[start_here]
; The dark "Start here" box above Chapter 1. Leave heading blank to remove the box.
badge = Start here
heading = Installing a new Hub?
text = Go directly to Chapter 2 and follow the on-screen setup guide: connect the Hub, join its Wi-Fi, confirm your preferences, then find your equipment and let LaunchControl build the dashboard. A pre-built floor plan for your coach does the last two steps for you.
link_text = Open Set Up Your Hub →
link = #set-up-your-hub

[images]
; PNG screenshots larger than this many KB are re-encoded as WebP when the page is built.
; The files in guide/images/ are never modified. Set to 0 to disable.
webp_threshold_kb = 150
webp_quality = 88
