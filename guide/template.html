<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{description}}">
  <title>{{title}}</title>
  <style>
:root {
  --lc-blue: #149bdf;
  --lc-blue-dark: #087caf;
  --lc-navy: #07131d;
  --lc-navy-2: #0b2234;
  --lc-ink: #101820;
  --lc-muted: #5b6670;
  --lc-paper: #ffffff;
  --lc-page: #f3f7f9;
  --lc-line: #dbe5ea;
  --lc-soft-blue: #eaf7fd;
  --lc-warning: #f3b526;
  --lc-content-width: 1380px;
  --lc-body-size: 17px;
  --lc-content-padding: 48px;
  --lc-radius: 16px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 28px; }
body {
  margin: 0;
  color: var(--lc-ink);
  background: var(--lc-page);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: var(--lc-body-size);
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--lc-blue-dark); text-decoration-thickness: 1px; text-underline-offset: 3px; }
img { display: block; max-width: 100%; height: auto; }
.lc-hero {
  position: relative;
  overflow: hidden;
  color: #fff;
  background:
    radial-gradient(circle at 74% 35%, rgba(20,155,223,.27), transparent 27%),
    linear-gradient(112deg, #050d13 5%, #0a2234 52%, #07131d 100%);
}
.lc-hero::before {
  position: absolute; inset: 0; content: ""; opacity: .25;
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 44px 44px;
}
.lc-hero__inner {
  position: relative; z-index: 1; display: grid; grid-template-columns: .9fr 1.1fr; gap: 64px; align-items: center;
  max-width: var(--lc-content-width); min-height: 540px; margin: 0 auto; padding: 68px 36px;
}
.lc-hero__eyebrow { margin: 0 0 14px; color: var(--lc-blue); font-size: 14px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
.lc-hero h1 { max-width: 650px; margin: 0 0 20px; color: #fff; font-size: clamp(44px, 6vw, 78px); line-height: .98; letter-spacing: -.045em; }
.lc-hero__lead { max-width: 610px; margin: 0 0 28px; color: #d8e6ee; font-size: clamp(18px, 2vw, 23px); line-height: 1.5; }
.lc-hero__meta { display: flex; flex-wrap: wrap; gap: 10px; }
.lc-hero__meta span { padding: 7px 11px; color: #dceaf2; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.11); border-radius: 999px; font-size: 13px; font-weight: 650; }
.lc-hero__visual { position: relative; padding: 18px; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.1); border-radius: 22px; box-shadow: 0 28px 70px rgba(0,0,0,.28); }
.lc-hero__visual img { width: 100%; border-radius: 13px; }
.lc-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 34px; max-width: var(--lc-content-width); margin: 0 auto; padding: 42px 36px 90px; }
.lc-sidebar { position: sticky; top: 24px; align-self: start; max-height: calc(100vh - 48px); overflow: auto; padding: 23px 18px; color: #fff; background: var(--lc-navy); border-radius: var(--lc-radius); box-shadow: 0 16px 36px rgba(5,25,38,.15); }
.lc-sidebar__title { margin: 0 0 14px 10px; color: #84cbea; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.lc-toc { display: grid; gap: 3px; }
.lc-toc__link { display: grid; grid-template-columns: 28px 1fr; gap: 4px; padding: 7px 9px; color: #dce9ef; border-radius: 7px; font-size: 13px; line-height: 1.27; text-decoration: none; }
.lc-toc__link span { color: var(--lc-blue); font-weight: 800; }
.lc-toc__link:hover { color: #fff; background: rgba(20,155,223,.14); }
.lc-manual__content { min-width: 0; }
.lc-start-here { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 20px; margin: 0 0 28px; padding: 25px 28px; color: #dce9ef; background: linear-gradient(120deg,var(--lc-navy),var(--lc-navy-2)); border-radius: var(--lc-radius); box-shadow: 0 14px 34px rgba(5,25,38,.13); }
.lc-start-here__badge { align-self: start; padding: 7px 11px; color: #fff; background: var(--lc-blue-dark); border-radius: 999px; font-size: 12px; font-weight: 820; letter-spacing: .08em; text-transform: uppercase; }
.lc-start-here h2 { margin: 0 0 7px; color: #fff; font-size: 25px; }
.lc-start-here p { margin: 0 0 9px; }
.lc-start-here a { color: #7fd3f5; font-weight: 740; text-decoration: none; }
.level1 { margin: 0 0 32px; padding: var(--lc-content-padding); background: var(--lc-paper); border: 1px solid var(--lc-line); border-radius: var(--lc-radius); box-shadow: 0 10px 28px rgba(25,52,66,.055); }
.level2 + .level2 { margin-top: 50px; padding-top: 46px; border-top: 1px solid var(--lc-line); }
.level3 { margin-top: 30px; }
.lc-chapter-label { margin-bottom: 8px; color: var(--lc-blue-dark); font-size: 13px; font-weight: 820; letter-spacing: .12em; text-transform: uppercase; }
h1, h2, h3 { color: var(--lc-ink); font-weight: 780; }
.level1 > h1 { margin: 0 0 22px; font-size: clamp(35px, 4vw, 54px); line-height: 1.04; letter-spacing: -.035em; }
h2 { margin: 0 0 16px; font-size: clamp(26px, 3vw, 34px); line-height: 1.16; letter-spacing: -.022em; }
h3 { margin: 26px 0 12px; font-size: 22px; line-height: 1.25; }
p { margin: 0 0 16px; }
.lc-lead { margin: -4px 0 27px; padding-left: 18px; color: #32424d; border-left: 4px solid var(--lc-blue); font-size: 20px; line-height: 1.52; }
ul, ol { margin: 14px 0 23px; padding-left: 27px; }
li { margin: 8px 0; padding-left: 4px; }
li::marker { color: var(--lc-blue-dark); font-weight: 800; }
li p { margin: 0; }
blockquote { margin: 14px 0 23px; padding: 4px 0 4px 18px; border-left: 4px solid var(--lc-line); color: #32424d; }
blockquote p:last-child { margin-bottom: 0; }
.lc-step { display: grid; grid-template-columns: 42px minmax(0,1fr); gap: 0 13px; margin: 11px 0; padding: 16px 18px; background: #f6fafc; border: 1px solid var(--lc-line); border-radius: 11px; }
.lc-step__number { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; color: #fff; background: linear-gradient(145deg,var(--lc-blue),var(--lc-blue-dark)); border-radius: 50%; font-size: 15px; }
.lc-step__content { display: block; min-width: 0; padding-top: 3px; overflow-wrap: anywhere; }
.lc-step__title { display: block; margin-bottom: 2px; color: var(--lc-ink); font-weight: 760; }
.lc-step__content a { overflow-wrap: anywhere; word-break: break-word; }
.lc-callout { margin: 24px 0; padding: 20px 22px; border-radius: 11px; }
.lc-callout p:last-child { margin-bottom: 0; }
.lc-callout--note { background: var(--lc-soft-blue); border-left: 5px solid var(--lc-blue); }
.lc-callout--warning { background: #fff8e7; border-left: 5px solid var(--lc-warning); }
.lc-callout__title { margin-bottom: 7px; font-weight: 800; }
.lc-callout--technical { padding: 0; overflow: hidden; color: #cad8df; background: #10232e; border: 1px solid #203b49; }
.lc-callout--technical summary { padding: 16px 20px; color: #89d0f0; cursor: pointer; font-weight: 760; }
.lc-callout--technical[open] summary { border-bottom: 1px solid #203b49; }
.lc-callout--technical > :not(summary) { margin-right: 20px; margin-left: 20px; }
.lc-callout--technical > :nth-child(2) { margin-top: 17px; }
.lc-callout--technical > :last-child { margin-bottom: 18px; }
.lc-table-wrap { width: 100%; margin: 23px 0 28px; overflow-x: auto; border: 1px solid var(--lc-line); border-radius: 11px; }
table { width: 100%; min-width: 580px; border-collapse: collapse; background: #fff; }
thead { color: #fff; background: var(--lc-navy-2); }
th, td { padding: 13px 16px; border-bottom: 1px solid var(--lc-line); text-align: left; vertical-align: top; }
th { font-size: 14px; letter-spacing: .015em; }
tbody tr:nth-child(even) { background: #f7fafb; }
tbody tr:last-child td { border-bottom: 0; }
.lc-figure { margin: 28px 0 32px; padding: 12px; background: #eaf0f3; border: 1px solid #d5e0e5; border-radius: 13px; }
.lc-figure > img { width: 100%; margin: 0 auto; border-radius: 7px; }
.lc-figure__gallery { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: center; }
.lc-figure__gallery img { width: auto; max-width: calc(33.333% - 8px); max-height: 680px; border-radius: 7px; }
.lc-figure figcaption { padding: 10px 5px 1px; color: var(--lc-muted); font-size: 13px; line-height: 1.4; }
.lc-back-to-top { display: inline-flex; margin-top: 28px; color: var(--lc-blue-dark); font-size: 13px; font-weight: 750; text-decoration: none; }
.lc-footer { padding: 38px 28px; color: #b8cbd5; background: var(--lc-navy); text-align: center; }
.lc-footer strong { color: #fff; }
.lc-binding-table { min-width: 720px; }
.lc-binding-table .lc-binding-group th {
  padding: 11px 16px;
  color: #fff;
  background: linear-gradient(105deg, var(--lc-blue-dark), var(--lc-navy-2));
  border-bottom: 0;
  font-size: 15px;
  letter-spacing: .055em;
  text-transform: uppercase;
}
.lc-binding-table .lc-binding-columns th { color: #17364a; background: #d9eef8; }
.lc-binding-table .lc-binding-note td { color: #40515d; background: var(--lc-soft-blue); font-size: 14px; font-style: italic; }
.lc-binding-table .lc-binding-spacer td { height: 13px; padding: 0; background: #fff; border: 0; }
.lc-binding-table td:nth-child(3) { white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
@media (max-width: 1040px) { .lc-layout { grid-template-columns: 230px minmax(0,1fr); gap: 24px; } :root { --lc-content-padding: 36px; } }
@media (max-width: 820px) { .lc-hero__inner { grid-template-columns: 1fr; min-height: 0; padding-top: 55px; } .lc-hero__visual { max-width: 680px; } .lc-layout { grid-template-columns: 1fr; padding: 24px 18px 65px; } .lc-sidebar { position: relative; top: 0; max-height: none; } .lc-toc { grid-template-columns: repeat(2,minmax(0,1fr)); } }
@media (max-width: 560px) { :root { --lc-body-size: 16px; --lc-content-padding: 24px; } .lc-hero__inner { gap: 34px; padding: 44px 20px; } .lc-hero h1 { font-size: 43px; } .lc-toc { grid-template-columns: 1fr; } .level1 { border-radius: 12px; } .lc-figure__gallery img { max-width: 100%; } .lc-step { grid-template-columns: 38px minmax(0,1fr); padding: 14px; } }
@media print {
  body { background: #fff; font-size: 11pt; }
  .lc-hero { color: #000; background: #fff; border-bottom: 2px solid #000; }
  .lc-hero__inner { min-height: 0; padding: 28px 0; }
  .lc-hero h1, .lc-hero__lead { color: #000; }
  .lc-hero__visual, .lc-sidebar, .lc-back-to-top { display: none; }
  .lc-layout { display: block; max-width: none; padding: 0; }
  .level1 { break-before: page; padding: 0; border: 0; box-shadow: none; }
  .level1:first-child { break-before: auto; }
  .lc-callout { break-inside: avoid; }
  .lc-callout--technical { color: #000; background: #eee; }
  a { color: #000; text-decoration: none; }
  .lc-binding-table { min-width: 0; font-size: 9.5pt; }
  .lc-binding-table th, .lc-binding-table td { padding: 7px 9px; }
}
</style>
</head>
<body id="top">
  <header class="lc-hero">
    <div class="lc-hero__inner">
      <div>
        <p class="lc-hero__eyebrow">{{eyebrow}}</p>
        <h1>{{title}}</h1>
        <p class="lc-hero__lead">{{lead}}</p>
        <div class="lc-hero__meta"><span>Software version {{version}}</span><span>{{date}}</span></div>
      </div>
      <div class="lc-hero__visual"><img src="{{hero_image}}" alt="{{hero_alt}}"></div>
    </div>
  </header>
  <div class="lc-layout">
    <aside class="lc-sidebar" aria-label="User guide chapters">
      <p class="lc-sidebar__title">In this guide</p>
      <nav class="lc-toc">{{toc}}</nav>
    </aside>
    <main class="lc-manual__content" id="manual-content">
{{start_here}}
{{chapters}}
</main>
  </div>
  <footer class="lc-footer"><strong>LaunchControl</strong><br>{{footer}}</footer>
</body>
</html>
